name: Build Android APK

# Run manually: GitHub → Actions → "Build Android APK" → Run workflow.
# Values left empty fall back to repository secrets:
#   APPFORGE_SITE_URL, APPFORGE_API_KEY, APPFORGE_API_SECRET, APPFORGE_APP_NAME, APPFORGE_PACKAGE_ID
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'WordPress site URL (e.g. https://mystore.pk/)'
        required: false
        default: ''
      api_key:
        description: 'App API key (WP Admin → AppForge → Settings)'
        required: false
        default: ''
      api_secret:
        description: 'App API secret'
        required: false
        default: ''
      app_name:
        description: 'App name shown under the icon'
        required: false
        default: ''
      package_id:
        description: 'Android package id (e.g. com.mystore.app)'
        required: false
        default: ''
  push:
    branches: [main, master]
    paths:
      - 'appforge_app/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: appforge_app
    env:
      SITE_URL: ${{ github.event.inputs.site_url || secrets.APPFORGE_SITE_URL || 'https://yourdomain.com/' }}
      API_KEY: ${{ github.event.inputs.api_key || secrets.APPFORGE_API_KEY || 'afk_demo' }}
      API_SECRET: ${{ github.event.inputs.api_secret || secrets.APPFORGE_API_SECRET || 'afs_demo' }}
      APP_NAME: ${{ github.event.inputs.app_name || secrets.APPFORGE_APP_NAME || 'AppForge Store' }}
      PACKAGE_ID: ${{ github.event.inputs.package_id || secrets.APPFORGE_PACKAGE_ID || 'com.appforge.store' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android project
        run: |
          if [ ! -d android ]; then
            flutter create --org com.appforge --project-name appforge_app --platforms android .
          fi
          rm -rf test   # the generated sample test refers to a MyApp class we don't have
          # Package id
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] && sed -i -E "s/applicationId(\s*=?\s*)\"[^\"]+\"/applicationId\1\"$PACKAGE_ID\"/" "$f" && grep -n "applicationId" "$f" || true
          done
          # App name + internet permission
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i -E "s/android:label=\"[^\"]*\"/android:label=\"$APP_NAME\"/" "$MANIFEST"
          grep -q "android.permission.INTERNET" "$MANIFEST" || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$MANIFEST"
          # Allow tel:, mailto:, WhatsApp and browser links on Android 11+
          grep -q "<queries>" "$MANIFEST" || sed -i 's#</manifest>#    <queries>\n        <intent><action android:name="android.intent.action.VIEW" /><data android:scheme="https" /></intent>\n        <intent><action android:name="android.intent.action.DIAL" /><data android:scheme="tel" /></intent>\n        <intent><action android:name="android.intent.action.SENDTO" /><data android:scheme="mailto" /></intent>\n    </queries>\n</manifest>#' "$MANIFEST"
          cat "$MANIFEST"

      - name: Install packages
        run: flutter pub get

      - name: Analyze (errors only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define=APPFORGE_BASE_URL="$SITE_URL" \
            --dart-define=APPFORGE_API_KEY="$API_KEY" \
            --dart-define=APPFORGE_API_SECRET="$API_SECRET"
          mkdir -p ../dist
          SAFE_NAME=$(echo "$APP_NAME" | tr ' ' '-' | tr -cd '[:alnum:]-')
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/${SAFE_NAME:-app}-${{ github.run_number }}.apk"
          ls -la ../dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          retention-days: 30

      - name: Publish release (public download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AppForge APK build ${{ github.run_number }}
          body: |
            Android APK built from commit ${{ github.sha }}.
            Site: ${{ env.SITE_URL }}
            Install: download the .apk on your phone and allow "Install unknown apps".
          files: dist/*.apk
          make_latest: true
