name: Plugin API tests

# Installs a fresh WordPress + WooCommerce, activates the AppForge plugin,
# seeds products / coupon / shipping and calls every app API endpoint.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'appforge-builder/**'
      - 'tests/**'
      - '.github/workflows/plugin-tests.yml'

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=30

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, gd, intl, zip
          tools: wp-cli

      - name: PHP syntax check (8.2)
        run: find appforge-builder -name '*.php' -print0 | xargs -0 -n1 php -l | grep -v 'No syntax errors' || true

      - name: Install WordPress + WooCommerce + AppForge
        run: |
          mkdir -p /tmp/wp && cd /tmp/wp
          wp core download --quiet
          wp config create --dbname=wp --dbuser=root --dbpass=root --dbhost=127.0.0.1 --quiet
          wp config set WP_DEBUG true --raw
          wp config set WP_DEBUG_LOG true --raw
          wp config set WP_DEBUG_DISPLAY false --raw
          wp config set WP_ENVIRONMENT_TYPE local
          wp core install --url=http://127.0.0.1:8080 --title="Test Store" --admin_user=admin --admin_password=admin --admin_email=admin@example.com --skip-email
          wp plugin install woocommerce --activate --quiet
          cp -r "$GITHUB_WORKSPACE/appforge-builder" wp-content/plugins/appforge-builder
          wp plugin activate appforge-builder
          wp eval-file "$GITHUB_WORKSPACE/tests/setup.php"
          echo "ADMIN_APP_PASSWORD=$(wp user application-password create admin api-tests --porcelain)" >> "$GITHUB_ENV"

      - name: Start PHP server
        run: |
          cd /tmp/wp
          nohup php -S 127.0.0.1:8080 -t /tmp/wp > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done

      - name: Run API tests
        run: python3 tests/api_test.py http://127.0.0.1:8080 /tmp/fixtures.json

      - name: Summary
        if: always()
        run: |
          [ -f test-report.md ] && cat test-report.md >> "$GITHUB_STEP_SUMMARY"
          echo '### PHP notices / errors' >> "$GITHUB_STEP_SUMMARY"
          { echo '```'; grep -i "appforge" /tmp/wp/wp-content/debug.log | tail -50 || echo 'none'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            test-report.md
            /tmp/wp/wp-content/debug.log
            /tmp/server.log
          if-no-files-found: ignore
