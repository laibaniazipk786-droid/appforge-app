name: appforge_app
description: AppForge - Flutter app rendered from the AppForge Builder WordPress plugin.
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  flutter_widget_from_html_core: ^0.15.2
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
